<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ChatRoom Test</title>
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/immersive-rp.css">
<link rel="stylesheet" href="src/components/layers/AtmosphereBackground.css">
<link rel="stylesheet" href="src/components/layers/CharacterHero.css">
<link rel="stylesheet" href="src/components/layers/FloatingContent.css">
<link rel="stylesheet" href="src/components/layers/MessageLayer.css">
<link rel="stylesheet" href="src/components/layers/InputDock.css">
<link rel="stylesheet" href="src/components/layers/BottomNavDock.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;height:100vh;background:#1a0a2e;font-family:-apple-system,sans-serif}
.chat-room-shell{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden}
</style></head><body>
<div class="atmo-bg" style="position:fixed;inset:0;background:linear-gradient(160deg,#1e1030,#2d1b4e,#1a0a2e);z-index:0;overflow:hidden">
<div style="position:absolute;width:300px;height:300px;top:-5%;left:-5%;background:radial-gradient(circle,#a78bfa,transparent 70%);opacity:0.3;border-radius:50%"></div>
<div style="position:absolute;width:240px;height:240px;bottom:15%;right:-3%;background:radial-gradient(circle,#f6b7d2,transparent 70%);opacity:0.25;border-radius:50%"></div>
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;opacity:0.5"></div>
</div>

<div class="hero" style="position:fixed;top:0;left:0;width:100%;height:35%;z-index:1;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px">
<div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,0.1);border-radius:20px;font-size:12px;color:rgba(255,255,255,0.8)">
  <div style="width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.5)"></div>
  <span>在线</span>
</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%">
  <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#a78bfa,#f6b7d2);display:flex;align-items:center;justify-content:center;color:white;font-size:40px">她</div>
</div>
<div style="pointer-events:auto;width:calc(100%-40px);display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.5);backdrop-filter:blur(20px);border-radius:24px;margin:0 20px;box-shadow:0 8px 30px rgba(130,100,180,0.12)">
  <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#f6b7d2);display:flex;align-items:center;justify-content:center;color:white;font-size:18px">她</div>
  <div style="flex:1"><div style="font-size:16px;font-weight:600;color:#44333d">她</div><div style="height:4px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;margin-bottom:4px"><div style="height:100%;width:78%;background:linear-gradient(90deg,#a78bfa,#f6b7d2);border-radius:2px"></div></div><div style="font-size:12px;color:#8c7a84">好感度 78%</div></div>
</div>
<div style="display:flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(255,255,255,0.1);border-radius:16px;font-size:14px;color:rgba(255,255,255,0.8)"><span>🥰</span><span>等待中</span></div>
</div>

<div style="position:fixed;top:35%;bottom:100px;left:0;right:0;z-index:3;overflow-y:auto;pointer-events:auto;padding:16px">
<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:12px">
  <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#f6b7d2);display:flex;align-items:center;justify-content:center;font-size:14px;color:white;flex-shrink:0">她</div>
  <div style="background:rgba(255,255,255,0.15);backdrop-filter:blur(18px);border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:80%;font-size:15px;color:rgba(255,255,255,0.9)">你来啦，今天过得怎么样？</div>
</div>
<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
  <div style="background:rgba(180,160,220,0.35);backdrop-filter:blur(18px);border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:80%;font-size:15px;color:rgba(255,255,255,0.9)">还不错，一直在等你呢</div>
</div>
<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:12px">
  <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#f6b7d2);display:flex;align-items:center;justify-content:center;font-size:14px;color:white;flex-shrink:0">她</div>
  <div style="background:rgba(255,255,255,0.15);backdrop-filter:blur(18px);border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:80%;font-size:15px;color:rgba(255,255,255,0.9)">我就知道你会来的😊 今天有什么开心的事吗？</div>
</div>
</div>

<div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:90%;max-width:500px;z-index:4;background:rgba(255,255,255,0.08);backdrop-filter:blur(25px);border-radius:32px;padding:8px 8px 8px 18px;display:flex;align-items:flex-end;gap:6px;border:1px solid rgba(255,255,255,0.06)">
  <textarea style="flex:1;background:transparent;border:none;color:rgba(255,255,255,0.85);font-size:15px;line-height:1.5;resize:none;outline:none;min-height:24px;max-height:100px;font-family:inherit" placeholder="和她说些什么..." rows="1"></textarea>
  <button style="width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(135deg,#a78bfa,#c4b5fd);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">↑</button>
</div>

<div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:fit-content;z-index:10;background:rgba(45,27,78,0.55);backdrop-filter:blur(30px);border-radius:28px;padding:8px 12px;display:flex;gap:4px;border:1px solid rgba(255,255,255,0.08)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:16px;background:transparent"><span style="font-size:18px">💬</span><span style="font-size:10px;color:rgba(232,223,245,0.5)">聊天</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:16px;background:transparent"><span style="font-size:18px">🎭</span><span style="font-size:10px;color:rgba(232,223,245,0.5)">角色</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:16px;background:transparent"><span style="font-size:18px">🧠</span><span style="font-size:10px;color:rgba(232,223,245,0.5)">记忆</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:16px;background:transparent"><span style="font-size:18px">⚙️</span><span style="font-size:10px;color:rgba(232,223,245,0.5)">设置</span></div>
</div>
</body></html>
