<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氛围背景层测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body>
  <!-- 模拟AtmosphereBackground层 -->
  <div class="atmo-wrapper" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: linear-gradient(160deg, 
      var(--bg-end, #f5f0fa) 0%, 
      var(--bg-main, #fff7fb) 50%, 
      var(--soft-purple-light, #ffd7ea) 100%
    );
  ">
    <!-- 光斑 -->
    <div class="atmo-orb atmo-orb-1" style="
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      opacity: 0.15;
      top: -5%;
      left: -5%;
      background: radial-gradient(circle, var(--soft-accent, #a78bfa) 0%, transparent 70%);
      animation: driftOrb1 25s ease-in-out infinite;
    "></div>
    
    <div class="atmo-orb atmo-orb-2" style="
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      opacity: 0.15;
      top: 10%;
      right: -3%;
      background: radial-gradient(circle, var(--soft-purple, #f6b7d2) 0%, transparent 70%);
      animation: driftOrb2 30s ease-in-out infinite;
    "></div>
    
    <div class="atmo-orb atmo-orb-3" style="
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      opacity: 0.1;
      top: 30%;
      left: 20%;
      background: radial-gradient(circle, var(--soft-accent-light, #c4b5fd) 0%, transparent 70%);
      animation: driftOrb3 35s ease-in-out infinite;
    "></div>
    
    <div class="atmo-orb atmo-orb-4" style="
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      opacity: 0.12;
      bottom: 10%;
      left: 10%;
      background: radial-gradient(circle, var(--soft-purple-light, #ffd7ea) 0%, transparent 70%);
      animation: driftOrb4 20s ease-in-out infinite;
    "></div>
    
    <div class="atmo-orb atmo-orb-5" style="
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      opacity: 0.08;
      bottom: -5%;
      right: 15%;
      background: radial-gradient(circle, var(--soft-accent, #a78bfa) 0%, transparent 70%);
      animation: driftOrb5 28s ease-in-out infinite;
    "></div>
    
    <!-- 网格纹理 -->
    <div class="atmo-grid" style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
      opacity: 0.03;
      background-image: 
        linear-gradient(rgba(167,139,250,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(167,139,250,0.3) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridFade 8s ease-in-out infinite;
    "></div>
  </div>
  
  <!-- 验证信息 -->
  <div style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100;
    text-align: center;
    pointer-events: auto;
  ">
    <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #333;">✅ 氛围背景层验证</h2>
    <p style="margin: 0; font-size: 13px; color: #666;">
      应看到：浅紫粉白渐变背景 + 5个缓慢移动的柔和光斑 + 极淡网格纹理
    </p>
  </div>
  
  <style>
    @keyframes driftOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -20px) scale(1.05); }
      50% { transform: translate(-10px, -40px) scale(1.02); }
      75% { transform: translate(-25px, -10px) scale(1.08); }
    }
    
    @keyframes driftOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-40px, 20px) scale(1.03); }
      50% { transform: translate(15px, 35px) scale(1.06); }
      75% { transform: translate(30px, -15px) scale(1.04); }
    }
    
    @keyframes driftOrb3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(20px, -30px) scale(1.04); }
      50% { transform: translate(-25px, -15px) scale(1.02); }
      75% { transform: translate(10px, 20px) scale(1.06); }
    }
    
    @keyframes driftOrb4 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-20px, 15px) scale(1.03); }
      50% { transform: translate(15px, -25px) scale(1.05); }
      75% { transform: translate(25px, 10px) scale(1.02); }
    }
    
    @keyframes driftOrb5 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(35px, -20px) scale(1.02); }
      50% { transform: translate(-15px, 30px) scale(1.06); }
      75% { transform: translate(-30px, -10px) scale(1.04); }
    }
    
    @keyframes gridFade {
      0%, 100% { opacity: 0.03; }
      50% { opacity: 0.06; }
    }
  </style>
</body>
</html>
