<title>Interlude</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.app { display: flex; flex-direction: column; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-gradient); }
.page { display: none; flex-direction: column; height: 100%; }
.page.active { display: flex; }

.search-bar { flex-shrink: 0; padding: 0 var(--space-lg); margin-bottom: var(--space-md); }

.search-icon { font-size: 16px; color: var(--text-hint); flex-shrink: 0; }

.search-input::placeholder { color: var(--text-hint); }
.section-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-lg); margin-bottom: var(--space-sm); }
.section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.section-extra { font-size: 13px; color: var(--accent-purple); }
.chat-list-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: var(--space-xl); }
.chat-list-scroll::-webkit-scrollbar { width: 0; display: none; }

.chat-card { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-lg); background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border-glass); border-radius: var(--radius-md); box-shadow: var(--shadow-card); transition: transform 0.2s; cursor: pointer; animation: cardIn 0.3s ease both; }
.chat-card:active { transform: scale(0.98); }
@keyframes cardIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.card-avatar { width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; position: relative; background: linear-gradient(135deg, #fff1f6, #ede9fe); }
.card-avatar .fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: var(--accent-pink); }
.card-avatar .online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; border-radius: 50%; background: #34d399; border: 2.5px solid rgba(255,255,255,0.9); }
.card-body { flex: 1; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.card-name { font-size: 16px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.card-time { font-size: 12px; color: var(--text-hint); flex-shrink: 0; margin-left: 8px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; }
.empty-icon { font-size: 56px; margin-bottom: var(--space-lg); opacity: 0.7; }
.empty-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.empty-desc { font-size: 14px; color: var(--text-muted); }
.bottom-nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-around; height: 68px; padding: 0 8px; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--card-bg-solid); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-top: 1px solid rgba(220,200,240,0.12); box-shadow: 0 -4px 24px rgba(170,140,255,0.06); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 12px; color: var(--text-muted); transition: color 0.25s; position: relative; }
.nav-icon { font-size: 24px; transition: transform 0.25s; line-height: 1; }
.nav-label { font-size: 11px; font-weight: 500; }
.nav-item.active { color: var(--accent-purple); }
.nav-item.active .nav-icon { transform: scale(1.1); filter: drop-shadow(0 2px 8px rgba(167,139,250,0.35)); }
.nav-item.active::after { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: var(--accent-gradient); border-radius: 0 0 3px 3px; }
.fab { position: fixed; right: var(--space-lg); z-index: 50; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent-gradient); color: white; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(246,183,210,0.35); transition: transform 0.2s; border: none; cursor: pointer; }
.fab:active { transform: scale(0.92); }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">{ "imports": { "react": "https://esm.sh/react@18.2.0", "react-dom/client": "https://esm.sh/react-dom@18.2.0/client" } }</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
function fmtTime(ts) {
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d/60000) + '分钟前';
  if (d < 86400000) return Math.floor(d/3600000) + '小时前';

function greeting() {
  const h = new Date().getHours();

  if (h < 18) return '下午好';

const MOCK = [
  { id:'c1', name:'爱莉希雅', summary:'你今天怎么这么晚才来陪我呀？', ts: Date.now()-300000, unread:1, online:true },
  { id:'c2', name:'克洛伊', summary:'主人今天辛苦了，要不要喝杯热茶？', ts: Date.now()-3600000, unread:0, online:true },
  { id:'c3', name:'雪乃', summary:'（轻轻翻开书页）今天的风好温柔。', ts: Date.now()-86400000, unread:0, online:false },
  { id:'c4', name:'祝吟1.1', summary:'收到大典设在辰时正。小寒山上的晨雾...', ts: Date.now()-172800000, unread:3, online:true },
];
function Home({ onChat }) {

    h('div', { className: 'header' },
      h('div', { className: 'header-top' },
        h('div', null, h('div', { className: 'greeting-time' }, greeting()), h('div', { className: 'greeting-sub' }, '今天想和谁聊天？')),
        h('div', { className: 'header-icons' }, h('div', { className: 'header-avatar' }, '你'), h('button', { className: 'header-icon-btn' }, '🔔'))
      )
    ),
    h('div', { className: 'search-bar' }, h('div', { className: 'search-wrapper' }, h('span', { className: 'search-icon' }, '🔍'), h('input', { className: 'search-input', placeholder: '搜索角色或聊天...', value: q, onChange: e => setQ(e.target.value) }))),
    h('div', { className: 'section-row' }, h('span', { className: 'section-title' }, '最近聊天'), h('span', { className: 'section-extra' }, MOCK.length + ' 个')),
    h('div', { className: 'chat-list-scroll' },
      list.length === 0

              h('div', { className: 'card-body' },
                h('div', { className: 'card-top' }, h('span', { className: 'card-name' }, c.name), h('span', { className: 'card-time' }, fmtTime(c.ts))),
                h('div', { className: 'card-bottom' }, h('span', { className: 'card-msg' }, c.summary), c.unread > 0 && h('span', { className: 'card-badge' }, c.unread))
              )
            ))
          )
    )
  );
}
function Characters() { return h('div', { className: 'page active' }, h('div', { className: 'header' }, h('div', { className: 'greeting-time', style:{fontSize:'24px'} }, '🎭 角色管理')), h('div', { className: 'chat-list-scroll', style:{textAlign:'center',padding:'80px 20px'} }, h('div', { className: 'empty-icon' }, '🎭'), h('div', { className: 'empty-title' }, '角色大厅'), h('div', { className: 'empty-desc' }, '管理你的角色卡'))) }
function Memory() { return h('div', { className: 'page active' }, h('div', { className: 'header' }, h('div', { className: 'greeting-time', style:{fontSize:'24px'} }, '🧠 记忆')), h('div', { className: 'chat-list-scroll', style:{textAlign:'center',padding:'80px 20px'} }, h('div', { className: 'empty-title' }, '记忆功能开发中...'))) }
function Settings() { return h('div', { className: 'page active' }, h('div', { className: 'header' }, h('div', { className: 'greeting-time', style:{fontSize:'24px'} }, '⚙️ 设置')), h('div', { className: 'chat-list-scroll', style:{textAlign:'center',padding:'80px 20px'} }, h('div', { className: 'empty-title' }, '设置页面'))) }
function App() {
  const [tab, setTab] = useState('home');
  const tabs = [{ id:'home', icon:'💬', label:'聊天' }, { id:'character', icon:'🎭', label:'角色' }, { id:'memory', icon:'🧠', label:'记忆' }, { id:'settings', icon:'⚙️', label:'设置' }];
  return h('div', { className: 'app' },
    tab === 'home' && h(Home, { onChat: c => console.log('打开聊天:', c.name) }),
    tab === 'character' && h(Characters),
    tab === 'memory' && h(Memory),
    tab === 'settings' && h(Settings),
    tab === 'home' && h('button', { className: 'fab' }, '+'),
    h('nav', { className: 'bottom-nav' }, tabs.map(t => h('button', { key: t.id, className: 'nav-item' + (tab === t.id ? ' active' : ''), onClick: () => setTab(t.id) }, h('span', { className: 'nav-icon' }, t.icon), h('span', { className: 'nav-label' }, t.label))))
  );

createRoot(document.getElementById('root')).render(h(App));
</script>
