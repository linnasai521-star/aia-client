<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CharacterHero 测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #f5f0fa 0%, #fff7fb 50%, #ffd7ea 100%);
    }
  </style>
</head>
<body>
  <!-- CharacterHero层模拟 -->
  <div class="hero" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 35%;
    z-index: 1;
    pointer-events: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 15px;
  ">
    <!-- 在线状态指示条 -->
    <div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,0.1);border-radius:20px;font-size:12px;color:rgba(255,255,255,0.8);">
      <div style="width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.5);animation:pulse 2s ease-in-out infinite;"></div>
      <span>在线</span>
    </div>
    
    <!-- 角色半身图 -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;">
      <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;animation:breathe 3s ease-in-out infinite;">
        <div style="width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg, #a78bfa, #f6b7d2);display:flex;align-items:center;justify-content:center;color:white;font-size:40px;font-weight:600;border:3px solid rgba(255,255,255,0.3);box-shadow:0 4px 20px rgba(130,100,180,0.2);">
          她
        </div>
      </div>
    </div>
    
    <!-- 毛玻璃横条 -->
    <div style="pointer-events:auto;width:calc(100% - 40px);display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.5);backdrop-filter:blur(20px);border-radius:24px;margin:0 20px;box-shadow:0 8px 30px rgba(130,100,180,0.12);border:1px solid rgba(255,255,255,0.3);">
      <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg, #a78bfa, #f6b7d2);display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:600;flex-shrink:0;">
        她
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:16px;font-weight:600;color:#44333d;margin-bottom:4px;">她</div>
        <div style="height:4px;background:rgba(255,255,255,0.3);border-radius:2px;margin-bottom:4px;overflow:hidden;">
          <div style="height:100%;width:78%;background:linear-gradient(90deg, #a78bfa, #f6b7d2);border-radius:2px;"></div>
        </div>
        <div style="font-size:12px;color:#8c7a84;">好感度 78%</div>
      </div>
    </div>
    
    <!-- 心情标签 -->
    <div style="display:flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(255,255,255,0.1);border-radius:16px;font-size:14px;color:rgba(255,255,255,0.8);">
      <span style="font-size:16px;">🥰</span>
      <span>等待中</span>
    </div>
  </div>
  
  <!-- 验证信息 -->
  <div style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100;
    text-align: center;
  ">
    <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #333;">✅ CharacterHero层验证</h2>
    <p style="margin: 0; font-size: 13px; color: #666;">
      应看到：在线状态条 + 角色头像(呼吸动画) + 毛玻璃信息条 + 心情标签
    </p>
  </div>
  
  <style>
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    }
  </style>
</body>
</html>
