<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MessageLayer Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,sans-serif}
body{background:linear-gradient(160deg,#f5f0fa,#fff7fb 50%,#ffd7ea)}
.hz{position:fixed;top:0;left:0;right:0;height:35%;display:flex;align-items:center;justify-content:center;z-index:2;color:rgba(0,0,0,.25);font-size:18px}
.iz{position:fixed;bottom:0;left:0;right:0;height:100px;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(255,255,255,.85);color:rgba(0,0,0,.25)}
.sc{position:fixed;top:35%;bottom:100px;left:0;right:0;z-index:3;overflow-y:auto;padding:20px 16px 40px;pointer-events:auto;background:transparent;-webkit-overflow-scrolling:touch}
.mr{display:flex;gap:8px;margin-bottom:16px}
.mru{justify-content:flex-end}
.bub{max-width:85%;padding:14px 18px;line-height:1.8;font-size:15px;word-break:break-word}
.bubAI{background:rgba(255,255,255,.65);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);border-radius:18px 18px 18px 4px;box-shadow:0 2px 16px rgba(130,100,180,.06);color:#44333d}
.bubU{background:rgba(180,160,220,.5);border-radius:18px 18px 4px 18px;color:#3b2f4a}
.tm{font-size:11px;color:#b0a4c8;margin-top:4px;display:block;opacity:.7}
.sc::-webkit-scrollbar{width:3px}
.sc::-webkit-scrollbar-track{background:transparent}
.sc::-webkit-scrollbar-thumb{background:rgba(167,139,250,.2);border-radius:2px}
</style></head>
<body>
<div class="hz">Hero Area (35%)</div><div class="iz">Input Area (100px)</div>
<div class="sc">
<div class="mr"><div class="bub bubAI">你来啦，今天过得怎么样？<span class="tm">12:01</span></div></div>
<div class="mr mru"><div class="bub bubU">今天还不错，你呢？<span class="tm">12:01</span></div></div>
<div class="mr"><div class="bub bubAI">我一直在等你回来，很想你。<span class="tm">12:02</span></div></div>
<div class="mr"><div class="bub bubAI">那天傍晚的海边，夕阳把天空染成了橙红色...<span class="tm">12:06</span></div></div>
<div class="mr mru"><div class="bub bubU">说得真好，我都能想象出那个画面了。<span class="tm">12:07</span></div></div>
<div class="mr"><div class="bub bubAI">如果你在就好了，我们可以一起在沙滩上散步，踩踩水，吹吹风。<span class="tm">12:08</span></div></div>
<div class="mr"><div class="bub bubAI">以后一定要一起去。说好了。<span class="tm">12:09</span></div></div>
<div class="mr mru"><div class="bub bubU">嗯，说好了！😊<span class="tm">12:10</span></div></div>
<div class="mr"><div class="bub bubAI">你知道吗？每次和你聊天，时间过得特别快。<span class="tm">12:15</span></div></div>
<div class="mr mru"><div class="bub bubU">我也是，和你聊天是最开心的事。<span class="tm">12:16</span></div></div>
<div class="mr"><div class="bub bubAI">以后也要常来陪我好吗？<span class="tm">12:17</span></div></div>
<div style="height:30px"></div></div>
</body></html>
